services:

  dzastr-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_EXPOSED_PORT:-5433}:5432"
    volumes:
      - dzaster-db-data:/var/lib/postgresql/data
    networks:
      - dzaster-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dzaster-auth:
    build:
      context: ./dzastr-auth
    ports:
      - "${AUTH_PORT:-8081}:8081"
    env_file:
      - ./.env
    environment:
      PORT: ${AUTH_PORT:-8081}
      DB_URL: ${DB_URL}
    depends_on:
      dzastr-db:
        condition: service_healthy
    networks:
      - dzaster-network

  dzaster-fo:
    build:
      context: ./dzastr-fo
      args:
        VITE_API_URL: http://dzaster-auth:${AUTH_PORT:-8081}
    ports:
      - "${FO_PORT:-4200}:80"
    depends_on:
      dzaster-auth:
        condition: service_started
    networks:
      - dzaster-network

volumes:
  dzaster-db-data:

networks:
  dzaster-network:
    driver: bridge