services:

  dzastr-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_EXPOSED_PORT:-5433}:5432"
    volumes:
      - dzaster-db-data:/var/lib/postgresql/data
    networks:
      - dzaster-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dzaster-auth:
    build:
      context: ./dzastr-auth
    ports:
      - "${AUTH_PORT:-8081}:8081"
    env_file:
      - .env
    environment:
      PORT: ${AUTH_PORT:-8081}
      DB_URL: ${DB_URL}
    depends_on:
      dzastr-db:
        condition: service_healthy
    networks:
      - dzaster-network

  dzaster-mo:
    build:
      context: ./dzastr-mo
    env_file:
      - .env
    environment:
      PORT: ${MO_PORT:-8000}
      DATABASE_URL: ${DB_URL}
      AUTH_SERVICE_URL: http://dzaster-auth:${AUTH_PORT:-8081}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    ports:
      - "${MO_PORT:-8000}:${MO_PORT:-8000}"
    depends_on:
      dzastr-db:
        condition: service_healthy
      dzaster-auth:
        condition: service_started
    networks:
      - dzaster-network

  dzaster-fo:
    build:
      context: ./dzastr-fo
      args:
        VITE_AUTH_API_URL: http://localhost:${AUTH_PORT:-8081}/api
        VITE_AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN}
        VITE_MO_SERVICE_TOKEN: ${SERVICE_TOKEN}
    environment:
      MO_API_UPSTREAM: dzaster-mo:${MO_PORT:-8080}
      MO_API_UPSTREAM_SCHEME: http
    ports:
      - "${FO_PORT:-4200}:80"
    depends_on:
      dzaster-auth:
        condition: service_started
      dzaster-mo:
        condition: service_started
    networks:
      - dzaster-network

volumes:
  dzaster-db-data:

networks:
  dzaster-network:
    driver: bridge