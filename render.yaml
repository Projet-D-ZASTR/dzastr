databases:

  # ─── Base de données PostgreSQL managée Render ──────────
  - name: dzastr-db
    plan: free
    databaseName: dzastr_db
    user: dzastr_user

services:

  # ─── Backend Auth ───────────────────────────────────────
  - type: web
    name: dzastr-auth
    runtime: docker
    rootDir: dzastr-auth
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dzastr-db
          property: connectionString
      - key: JWT_SECRET
        sync: false   # ⚠️ À définir manuellement dans le dashboard Render
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: AUTH_SERVICE_TOKEN
        sync: false

  # ─── Backend MO ─────────────────────────────────────────
  - type: web
    name: dzastr-moteur
    runtime: docker
    rootDir: dzastr-mo
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: dzastr-db
          property: connectionString
      - key: JWT_SECRET
        sync: false   # ⚠️ Même secret que dzastr-auth — à définir manuellement

  # ─── Frontend Angular ────────────────────────────────────
  - type: web
    name: dzastr-front
    runtime: docker
    rootDir: dzastr-front
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DZASTR_AUTH_API_URL
        fromService:
          name: dzastr-auth
          type: web
          property: host
      - key: DZASTR_MOTEUR_API_URL
        fromService:
          name: dzastr-moteur
          type: web
          property: host
